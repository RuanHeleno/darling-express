name: darling-express-prod

x-backend-env: &backend_env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-api.example.com,localhost,127.0.0.1}
  DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-https://app.example.com}
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-darling}:${POSTGRES_PASSWORD:-darling}@postgres:5432/${POSTGRES_DB:-darling_express}}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY?DJANGO_SECRET_KEY is required}
  INFINITEPAY_WEBHOOK_SECRET: ${INFINITEPAY_WEBHOOK_SECRET?INFINITEPAY_WEBHOOK_SECRET is required}
  INFINITEPAY_API_KEY: ${INFINITEPAY_API_KEY?INFINITEPAY_API_KEY is required}
  LALAMOVE_API_KEY: ${LALAMOVE_API_KEY?LALAMOVE_API_KEY is required}
  LALAMOVE_BASE_URL: ${LALAMOVE_BASE_URL:-https://rest.sandbox.lalamove.com}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-darling_express}
      POSTGRES_USER: ${POSTGRES_USER:-darling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darling}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-darling} -d ${POSTGRES_DB:-darling_express}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8000)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend_env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A config worker -l info

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend_env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A config beat -l info

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro

volumes:
  postgres_data:
  redis_data:
